name: Coverage Comment

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    # A failed Test run still uploads coverage when only a module threshold failed.
    if: >-
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage data
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-data
          path: ./coverage
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Post coverage comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Parse JaCoCo XML format: sum LINE covered/missed across all counters
            function lineCoverage(reportFile) {
              if (!fs.existsSync(reportFile)) return 'unknown';
              const xml = fs.readFileSync(reportFile, 'utf8');
              let missed = 0;
              let covered = 0;
              for (const match of xml.matchAll(/<counter type="LINE" missed="(\d+)" covered="(\d+)"\/>/g)) {
                missed += Number(match[1]);
                covered += Number(match[2]);
              }
              const total = missed + covered;
              return total > 0 ? ((covered / total) * 100).toFixed(1) : '0';
            }

            const prNumber = parseInt(fs.readFileSync('./coverage/pr-number', 'utf8'));
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed('Invalid PR number in coverage artifact');
              return;
            }
            // The artifact names the PR, so confirm it is the one this Test run built.
            const run = context.payload.workflow_run;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.head.sha !== run.head_sha || pr.head.repo?.full_name !== run.head_repository?.full_name) {
              core.setFailed(`PR #${prNumber} does not match the Test run's head commit`);
              return;
            }
            const overall = lineCoverage('./coverage/build/reports/kover/report.xml');

            const rows = [];
            const violations = [];
            // Artifact contents come from the PR, so render them only as inert code.
            function codeBlock(text) {
              const clipped = text.length > 2000 ? `${text.slice(0, 2000)}…` : text;
              const longestRun = Math.max(0, ...(clipped.match(/`+/g) || []).map((run) => run.length));
              const fence = '`'.repeat(Math.max(3, longestRun + 1));
              return `${fence}\n${clipped}\n${fence}`;
            }

            const modules = fs.readdirSync('./coverage').filter((d) => /^platform-[a-z0-9-]+$/.test(d)).sort();
            for (const module of modules) {
              const reportDir = path.join('./coverage', module, 'build/reports/kover');
              const errorFile = path.join(reportDir, 'verify.err');
              const verified = fs.existsSync(errorFile);
              const error = verified ? fs.readFileSync(errorFile, 'utf8').trim() : '';
              const status = !verified ? '❔' : error ? '❌' : '✅';
              rows.push(`| ${module} | ${lineCoverage(path.join(reportDir, 'report.xml'))}% | ${status} |`);
              if (error) violations.push(`**${module}**\n\n${codeBlock(error)}`);
            }

            let body = `## Code Coverage Report\n\n**Overall Line Coverage:** ${overall}%\n\n`;
            body += `| Module | Line Coverage | Threshold |\n|---|---|---|\n${rows.join('\n')}\n\n`;
            if (violations.length > 0) body += `${violations.join('\n\n')}\n\n`;
            body += '_Generated from Kover XML report._';

            // Delete previous coverage comments
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            for (const comment of comments.data) {
              if (comment.body.startsWith('## Code Coverage Report')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body,
            });
