name: Release

# Releases are dispatched by hand. There is no push trigger: the version that
# ships is an explicit input, not something inferred from the commit window.
#
# `scripts/release.sh` does the work. It still uses the conventional-commit
# analyzer and the release-notes generator, but as *libraries* — see the header
# of that script, and RELEASING.md for the operator-facing account.

on:
  workflow_dispatch:
    inputs:
      version:
        description: |
          The version to publish (bare semver, e.g. 2.2.0). Look at the most
          recent merged PR's Commit Lint comment for the calculated value, or
          run locally:
            node scripts/preview-release.mjs \
              --base $(git describe --tags --abbrev=0 main) --head main
          You can override the calculated value here — the workflow logs both
          side-by-side in the run summary for audit.
        required: true
        type: string
      dry-run:
        description: "Rehearsal: run end-to-end up to the local release commit + tag, then stop. Skips push, publish, and the GitHub release."
        required: false
        type: boolean
        default: false

env:
  # The modules published as a set. All three always ship on the same version —
  # a consumer mixing 2.1.2 platform-core with 2.2.0 platform-ui is not a
  # configuration we support. This is the single place that list is declared;
  # scripts/release.sh reads it and publishes one module per Gradle invocation.
  PUBLISHABLE_MODULES: platform-core,platform-ui,platform-reader

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # A release is the one path that reaches consumers without a PR in front of
  # it, so the test suite runs here even though it also ran on the PR that
  # produced the commit being released.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-release
      - name: Run tests
        run: ./gradlew test

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    # Maven Central and GPG credentials are scoped to this environment, and its
    # deployment-branch policy is what keeps a dispatch from a feature branch
    # from reaching them. scripts/release.sh independently refuses to push when
    # HEAD is not origin/main.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the analyzer walks back to the last tag, and
          # release.sh compares HEAD against origin/main.
          fetch-depth: 0
          # The SSH key persists in the git remote so the release commit and
          # tag can be pushed to `main` past the branch-protection ruleset.
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: ./.github/actions/setup-release

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:youversion/platform-sdk-kotlin.git

      - name: Release
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run && '1' || '0' }}
          # GH_TOKEN is what the `gh` CLI reads for `gh release create`.
          # GITHUB_TOKEN is exported too for anything else expecting it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNINGKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNINGKEY_PASSWORD }}
          GIT_AUTHOR_NAME: "github-actions[bot][release]"
          GIT_AUTHOR_EMAIL: "github-actions[bot][release]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot][release]"
          GIT_COMMITTER_EMAIL: "github-actions[bot][release]@users.noreply.github.com"
        run: bash scripts/release.sh

  # Observes how long Maven Central's mirror takes to serve the new coordinates
  # and writes a table to the run summary. Never fails the workflow: indexing
  # lag is expected, and failing here would make every release look red after
  # the artifacts are already immutable on Central.
  post-publish-verify:
    name: Post-publish verification
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry-run }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Maven Central propagation
        run: |
          set -euo pipefail
          IFS=',' read -ra modules <<< "${PUBLISHABLE_MODULES}"
          bash scripts/poll-central-index.sh "${{ inputs.version }}" "${modules[@]}"
