name: Test

on: [pull_request]

jobs:
  test:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests with Coverage
        id: tests
        run: ./gradlew koverXmlReport

      - name: Verify per-module coverage thresholds
        run: ./gradlew koverVerify --continue

      - name: Save PR number
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: echo ${{ github.event.number }} > pr-number

      # Uploaded even when a threshold fails, so the PR comment can show which module fell short.
      - name: Upload coverage data
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: |
            build/reports/kover/report.xml
            platform-*/build/reports/kover/report.xml
            platform-*/build/reports/kover/verify.err
            pr-number
