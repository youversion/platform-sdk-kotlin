name: Consumer Baseline

on:
  pull_request:
    paths:
      - 'gradle/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'buildSrc/**'
      - 'build-logic/**'
      - 'examples/consumer-baseline/**'
      - '.github/workflows/consumer-baseline.yml'
  workflow_call:

jobs:
  consumer-baseline:
    name: Build Oldest Supported Consumer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew examples/consumer-baseline/gradlew

      - name: Publish SDK to Maven Local
        run: ./gradlew publishToMavenLocal -PsdkVersion=0.0.0-SNAPSHOT

      - name: Assemble consumer baseline
        working-directory: examples/consumer-baseline
        run: ./gradlew :app:assembleDebug
